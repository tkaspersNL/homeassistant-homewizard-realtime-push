name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/homewizard_realtime_push/manifest.json)
          if [ "$version" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi
      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
