[project]
name = "homeassistant-homewizard-realtime-push"
version = "0.1.0"
description = "Real-time HomeWizard P1 measurements for Home Assistant over the API v2 WebSocket."
license = "MIT"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PL",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "TC",
    "UP",
    "W",
]
ignore = [
    "ASYNC109",
    "D202",
    "D203",
    "D213",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    # Home Assistant style: plain runtime imports, no TYPE_CHECKING blocks.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "SLF001", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.homewizard_realtime_push"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["custom_components/homewizard_realtime_push"]

[[tool.mypy.overrides]]
module = ["homewizard_energy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/homewizard_realtime_push"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
